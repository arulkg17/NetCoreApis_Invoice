apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config

data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "{{ .Values.appsettings.logLevel }}"
        }
      },
      "ConnectionStrings": {
        "DefaultConnection": "{{ .Values.appsettings.connectionString }}"
      },
      "ApiSettings": {
        "BaseUrl": "{{ .Values.appsettings.apiUrl }}"
      }
    }