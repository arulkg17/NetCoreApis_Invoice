apiVersion: apps/v1
kind: Deployment
metadata:
  name: productapi-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productapi
  template:
    metadata:
      labels:
        app: productapi
    spec:
      containers:
      - name: productapi
        image: productapi:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080